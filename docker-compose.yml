services:
  postgres:
    platform: linux/amd64
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lab_backend_2026
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lab_backend_2026"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
  
  pgadmin:
    platform: linux/amd64
    image: dpage/pgadmin4:7.7
    environment:
      PGADMIN_DEFAULT_EMAIL: michaelsoliveira@gmail.com
      PGADMIN_DEFAULT_PASSWORD: secret
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
